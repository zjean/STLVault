# Disabled on this fork.
#
# Upstream's release flow computes the next semver via
# `reecetech/version-increment` (conventional_commits scheme) and tags + drafts
# a release. That scheme conflicts with this fork's `<upstream-base>-custom.<n>`
# versioning (see CLAUDE.md), and the workflow requires `secrets.PAT_TOKEN`
# which the fork does not provide.
#
# Trigger was already `workflow_dispatch` only upstream — left as-is so it
# doesn't fire automatically. The body is preserved verbatim for reference;
# the fork should cut releases manually (or via a fork-specific workflow added
# later) until a proper release pipeline lands.

name: Tag and Release

on:
  workflow_dispatch:

jobs:
  build:
    # Guard: disabled on this fork pending a versioning scheme that matches
    # CLAUDE.md's `<upstream-base>-custom.<n>` convention.
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@main

      - name: Get next version
        uses: reecetech/version-increment@2024.10.1
        id: version
        with:
          scheme: conventional_commits

      - name: Tag and Release
        uses: BrandonStudio/tag-and-release@v1
        with:
          tag_name: ${{ steps.version.outputs.v-version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
