# Disabled on this fork.
#
# Upstream auto-bumps frontend/package.json on every PR merge via
# `reecetech/version-increment` (conventional_commits scheme). That scheme
# produces plain `<major>.<minor>.<patch>` versions, which conflicts with this
# fork's `<upstream-base>-custom.<n>` versioning (see CLAUDE.md). It also
# requires `secrets.PAT_TOKEN`, which the fork does not provide.
#
# Trigger reduced to `workflow_dispatch` only so it doesn't fire on PR merges
# (the original failure mode that produced a red X on every fork PR). Body
# preserved verbatim for reference / future adaptation.

name: Bump App Semver

on:
  workflow_dispatch:

jobs:
  run:
    if: github.event.pull_request.merged == true
    name: Bump stack version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Get next version
        uses: reecetech/version-increment@2024.10.1
        id: version
        with:
          scheme: conventional_commits

      - name: Find and Replace in package
        uses: thiagodnf/string-replacer@v1.0.2
        with:
          find: '"version": ".+"'
          replace: '"version": "${{ steps.version.outputs.version }}"'
          include: |
            frontend/package.json

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: ${{ github.event.pull_request.title }}
          add: '["frontend/package.json"]'
