# Disabled on this fork. See `Docker Backend CI.yml` for the rationale —
# same constraints apply: upstream's namespace, missing secrets, semver-scheme
# mismatch. Replace rather than re-enable when a fork-flavored image pipeline
# is needed.

name: Docker Frontend CI

on:
  workflow_dispatch:

jobs:
  docker:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get version
        uses: reecetech/version-increment@2024.10.1
        id: version
        with:
          scheme: conventional_commits

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: moddroid94/stlvault-frontend:latest,moddroid94/stlvault-frontend:${{ steps.version.outputs.current-v-version }}
